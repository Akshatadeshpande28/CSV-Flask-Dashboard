<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Data Insight Pro - Interactive CSV analytics dashboard built with Flask, Pandas and Plotly.">

    <title>
        {% block title %}Data Insight Pro{% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

    {% block head %}
    {% endblock %}
</head>


<body>

<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">

    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold"
           href="{{ url_for('index') }}">

            <i class="bi bi-bar-chart-fill me-2"></i>

            Data Insight Pro

        </a>


        <div class="ms-auto d-flex align-items-center gap-2">

            <span class="d-none d-md-inline text-white small me-2">
                CSV Analytics Dashboard
            </span>

            <button
                id="themeToggle"
                class="btn btn-light btn-sm"
                type="button">

                <i class="bi bi-moon-stars-fill me-1"></i>
                Dark Mode

            </button>

        </div>

    </div>

</nav>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="container-fluid dashboard-container">

    {% block content %}
    {% endblock %}

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="dashboard-footer">

    <div class="container text-center">

        <p class="mb-1 fw-semibold">
            Data Insight Pro
        </p>

        <p class="mb-0 small">
            Built with Python • Flask • Pandas • Plotly
        </p>

    </div>

</footer>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Custom JavaScript -->

<script
    src="{{ url_for('static', filename='script.js') }}">
</script>


{% block scripts %}
{% endblock %}

</body>

</html>
